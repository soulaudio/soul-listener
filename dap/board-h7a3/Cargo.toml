[package]
name = "board-h7a3"
version = "0.1.0"
edition = "2021"
# Internal firmware binary, never published — marks it private so cargo-deny's
# `[licenses] private.ignore` skips it (the repo is MIT OR Apache-2.0; see LICENSE).
publish = false

# Member of the dap/ workspace (dap/Cargo.toml), not a standalone workspace.
# The dap/ workspace as a whole is excluded from the repo-root workspace:
# embassy-stm32 0.6 pulls embassy-time-driver 0.2.2, which declares
# `links = "embassy-time"` -- the same links value that embassy-executor
# "=0.6.3" (used by the old `firmware` crate, Embassy 0.1 line) pulls in via
# embassy-time-driver ^0.1.0. Cargo enforces link-uniqueness across the whole
# resolve graph of a single Cargo.lock, regardless of feature gating, so the
# two Embassy major lines cannot share one workspace lock file. See the root
# Cargo.toml's `workspace.exclude` comment for the full explanation. The
# dap/Cargo.toml workspace root carries the opt-level=3 soul-audio-core
# profile override for this crate (non-root member profile tables are
# ignored by Cargo).

[features]
hardware = ["dep:embassy-executor", "dep:embassy-time", "dep:embassy-stm32",
            "dep:cortex-m-rt", "dep:cortex-m", "dep:defmt", "dep:defmt-rtt", "dep:panic-probe",
            "dep:soul-audio-core", "dep:static_cell", "dep:dap-core"]

[[bin]]
name = "board-h7a3"
required-features = ["hardware"]
test = false
bench = false

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"], optional = true }
embassy-time     = { version = "0.5", optional = true }
# NOTE: `memory-x` is deliberately OFF — board-h7a3 ships its own crate-root
# memory.x (see that file's header) so flip-link can find the RAM region. Enabling
# memory-x here would put a second memory.x on the linker search path.
embassy-stm32    = { version = "0.6", features = ["stm32h7a3zi", "time-driver-any"], optional = true }
cortex-m-rt = { version = "0.7", optional = true }
# Provides the critical-section implementation embassy-sync/embassy-stm32 link against
# (critical_section_1_0_acquire/_release). Not in the brief's dependency list but
# required to link: see task-2-report.md for the exact linker error this fixes.
cortex-m    = { version = "0.7", features = ["critical-section-single-core"], optional = true }
defmt       = { version = "1", optional = true }
defmt-rtt   = { version = "1", optional = true }
panic-probe = { version = "1", features = ["print-defmt"], optional = true }
# Phase-1 de-risking spike (migration/phase-1): prove soul-audio-core compiles
# and links for thumbv7em-none-eabihf inside the dap/ workspace.
# default-features = false (set on the workspace dependency in dap/Cargo.toml)
# is mandatory -- the default/`playback` feature pulls std+cpal, which must
# never be enabled on the target.
soul-audio-core = { workspace = true, optional = true }
# The board-agnostic App/ports (Phase B: construct the full App -- audio +
# power + controls + display -- and run its real tick loop here, instead of
# the old bogus-bytes `open()` smoke test). `stub`: the no_std, no-alloc
# placeholder port adapters (StubSink/StubStorage/StubControls/StubPower/
# StubDisplay) this crate wires up until Phase E's real hardware drivers
# exist -- see `dap-core/src/stub.rs`.
dap-core = { path = "../core", features = ["stub"], optional = true }
# Externalized decoder scratch storage (see soul-audio-core's
# `decoder_scratch_len`/`open`): the board needs a `&'static mut [i32]` to
# hand `open()` without an allocator. `StaticCell` is this repo's established
# pattern for exactly this (see the root workspace's `crates/firmware/src/main.rs`
# FRAMEBUFFER/AUDIO_BUFFER statics) -- a static-storage, no-alloc, no-`unsafe`
# way to get a sound `&'static mut` out of a `static`. Version matches
# `dap/sim`'s dev-dependency (already resolved in this workspace's Cargo.lock).
static_cell = { version = "2", optional = true }

# cortex-m and cortex-m-rt are link-time dependencies (the reset vector / entry
# point via #[cortex_m_rt::entry], and the critical-section-single-core impl) —
# they have no `use` statement, so cargo-machete reports them as unused. They are
# required to link; tell machete to ignore them.
[package.metadata.cargo-machete]
ignored = ["cortex-m", "cortex-m-rt"]
