# board-h7a3 builds inside the dap/ workspace. The root .cargo/config forces
# `linker = "flip-link"`, but in a workspace flip-link's own linker-script search
# (CWD = workspace root) can't find board-h7a3/memory.x and fails CI with
# "MEMORY.RAM not found" — even though rust-lld resolves memory.x fine via the
# -L path build.rs emits. So override ONLY the linker here to plain rust-lld
# (flip-link just wraps it); do NOT re-list -Tlink.x/-Tdefmt.x, since cargo JOINS
# target.rustflags across config files and a second -Tlink.x double-includes
# memory.x ("region FLASH already defined"). flip-link's stack-overflow
# protection is covered statically by the mcu-stack-budget CI gate; restoring
# flip-link here is tracked once there is hardware to validate on.
[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32H7A3ZITxQ"
linker = "rust-lld"
