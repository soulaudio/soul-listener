[package]
name = "dap-core"
version = "0.1.0"
edition = "2021"
description = "Board-agnostic DAP logic and ports (no_std, no embassy; usable from host and target)."

[dependencies]
# default-features = false set at the workspace level (dap/Cargo.toml).
soul-audio-core = { workspace = true }
soul-audio-engine = { workspace = true }
# Bounded (no-alloc) collections for PowerService::poll's returned event set.
# no_std-first by design; already resolved in this workspace's Cargo.lock as
# a transitive dep of board-h7a3's embassy-stm32 (hardware feature).
heapless = { version = "0.9", default-features = false }

# E-ink drawing toolkit (crates/eink/* in the root workspace, consumed in
# place via the path deps in dap/Cargo.toml's [workspace.dependencies] — see
# that file's comment). Default features only: no "std" (keeps the no_std
# build path exercised on host too) and no "examples" (pulls eink-emulator).
eink-system = { workspace = true }
eink-components = { workspace = true }
eink-specs = { workspace = true }
# Must match the version eink-system/eink-components are built against
# (crates/eink/*/Cargo.toml both pin "0.8.1") so `Gray4`/`DrawTarget`/
# `Rectangle` in this crate's `display` port are the exact same types.
embedded-graphics = "0.8.1"
