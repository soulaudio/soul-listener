[package]
name = "dap-core"
version = "0.1.0"
edition = "2021"
# Internal firmware crate, never published — marks it private so cargo-deny's
# `[licenses] private.ignore` skips it (the repo is MIT OR Apache-2.0; see LICENSE).
publish = false
description = "Board-agnostic DAP logic and ports (no_std, no embassy; usable from host and target)."

# `stub`: compiles in `src/stub.rs`'s no_std, no-alloc placeholder port
# adapters (StubSink/StubStorage/StubControls/StubPower/StubDisplay) — the
# board's "no hardware yet" stand-ins, real hardware adapters (Phase E)
# replace them one at a time. Off by default: nothing outside `board-h7a3`
# (and the host tests that exercise exactly the same wiring) needs these
# types, so they don't pollute the default build/doc surface.
[features]
stub = []

[dependencies]
# default-features = false set at the workspace level (dap/Cargo.toml).
soul-audio-core = { workspace = true }
soul-audio-engine = { workspace = true }
# Bounded (no-alloc) collections for PowerService::poll's returned event set.
# no_std-first by design; already resolved in this workspace's Cargo.lock as
# a transitive dep of board-h7a3's embassy-stm32 (hardware feature).
heapless = { version = "0.9", default-features = false }
# no_std float intrinsics (f32::sqrt is std-only): the power model's regulator
# curve uses libm::sqrtf. Already in the workspace lock as a transitive dep.
libm = "0.2"

# The e-ink UI toolkit (standalone eink-ui crate; no_std/no-alloc by default, so
# this crate — and board-h7a3 — stays alloc-free). Screens draw with its widgets.
eink-ui = { workspace = true }
# Panel hardware specs (controller timing/quirks) for the board's display driver.
eink-specs = { workspace = true }
# Must match the version eink-ui + eink-specs are built against (both "0.8") so
# `Gray4`/`DrawTarget`/`Rectangle` in this crate's `display` port are the exact
# same types.
embedded-graphics = "0.8.1"
