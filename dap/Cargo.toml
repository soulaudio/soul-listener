[workspace]
resolver = "2"
members = ["core", "sim", "board-h7a3", "arch-tests"]

[workspace.dependencies]
# Sibling repo D:/dev/soulaudio/soul-audio-core, two levels up from this file
# (dap/Cargo.toml -> dap/ -> soul-listener-gh/ -> soulaudio/).
# embedded-profile: stereo-only DAP target — drops the surround/multichannel
# decoders (dead code on a stereo DAC) to fit the H7A3 SRAM budget. Surround
# source files are downmixed to stereo at DAP import (see soul-audio-core's
# dap-index doc). All stereo/mono formats are unaffected.
soul-audio-core   = { path = "../../soul-audio-core/crates/soul-audio-core", default-features = false, features = ["embedded-profile"] }
soul-audio-engine = { path = "../../soul-audio-core/crates/soul-audio-engine" }
# The on-SD `.soulidx` catalog reader (no_std, no-alloc default surface) —
# dap-arch-tests pins `IndexReader<Src>` to the catalog-index SRAM budget.
soul-audio-index  = { path = "../../soul-audio-core/crates/soul-audio-index" }

# The e-ink UI toolkit is the standalone `eink-ui` crate at the repo root (its
# own workspace, excluded from both this one and the root). dap/ consumes it via
# a path dep; it is no_std/no-alloc by default — exactly what dap-core needs, and
# why board-h7a3 needs no heap allocator.
eink-ui = { path = "../eink-ui" }
# eink-specs carries the panel hardware specs (controller timing/quirks/
# dimensions) the board's real display driver needs — kept from the retired v1
# eink crates.
eink-specs = { path = "../crates/eink/eink-specs" }

# soul-audio-core decodes far too slowly unoptimized: keep it at -O3 even in
# dev/test builds so the hardware target still decodes faster than real time.
[profile.dev.package.soul-audio-core]
opt-level = 3
[profile.test.package.soul-audio-core]
opt-level = 3
