[workspace]
resolver = "2"
members = ["core", "sim", "board-h7a3", "arch-tests"]

[workspace.dependencies]
# Sibling repo D:/dev/soulaudio/soul-audio-core, two levels up from this file
# (dap/Cargo.toml -> dap/ -> soul-listener-gh/ -> soulaudio/).
soul-audio-core   = { path = "../../soul-audio-core/crates/soul-audio-core", default-features = false }
soul-audio-engine = { path = "../../soul-audio-core/crates/soul-audio-engine" }

# The e-ink drawing toolkit lives in THIS repo's root workspace
# (soul-listener-gh/Cargo.toml), not dap/'s. It's embassy-free and already
# no_std/embedded-graphics-based, so dap/ consumes it in place via path deps
# rather than moving or duplicating it. Each crate still resolves its own
# `workspace.dependencies`/`workspace.lints` against the ROOT workspace (via
# normal ancestor-directory discovery from its own manifest path) even
# though it's being pulled in from dap/'s separate workspace here.
eink-system     = { path = "../crates/eink/eink-system" }
eink-components = { path = "../crates/eink/eink-components" }
eink-specs      = { path = "../crates/eink/eink-specs" }

# soul-audio-core decodes far too slowly unoptimized: keep it at -O3 even in
# dev/test builds so the hardware target still decodes faster than real time.
[profile.dev.package.soul-audio-core]
opt-level = 3
[profile.test.package.soul-audio-core]
opt-level = 3
