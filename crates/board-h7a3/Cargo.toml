[package]
name = "board-h7a3"
version = "0.1.0"
edition = "2021"

# Standalone workspace (own Cargo.lock), deliberately NOT a member of the
# repo-root workspace. embassy-stm32 0.6 pulls embassy-time-driver 0.2.2,
# which declares `links = "embassy-time"` -- the same links value that
# embassy-executor "=0.6.3" (used by the old `firmware` crate, Embassy 0.1
# line) pulls in via embassy-time-driver ^0.1.0. Cargo enforces
# link-uniqueness across the whole resolve graph of a single Cargo.lock,
# regardless of feature gating, so the two Embassy major lines cannot share
# one workspace lock file. See the root Cargo.toml's `workspace.exclude`
# comment for the full explanation.
[workspace]

[features]
hardware = ["dep:embassy-executor", "dep:embassy-time", "dep:embassy-stm32",
            "dep:cortex-m-rt", "dep:cortex-m", "dep:defmt", "dep:defmt-rtt", "dep:panic-probe"]

[[bin]]
name = "board-h7a3"
required-features = ["hardware"]
test = false
bench = false

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"], optional = true }
embassy-time     = { version = "0.5", optional = true }
embassy-stm32    = { version = "0.6", features = ["stm32h7a3zi", "memory-x", "time-driver-any"], optional = true }
cortex-m-rt = { version = "0.7", optional = true }
# Provides the critical-section implementation embassy-sync/embassy-stm32 link against
# (critical_section_1_0_acquire/_release). Not in the brief's dependency list but
# required to link: see task-2-report.md for the exact linker error this fixes.
cortex-m    = { version = "0.7", features = ["critical-section-single-core"], optional = true }
defmt       = { version = "1", optional = true }
defmt-rtt   = { version = "1", optional = true }
panic-probe = { version = "1", features = ["print-defmt"], optional = true }
