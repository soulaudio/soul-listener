# Hardware CI — SoulAudio DAP (atopile design check)
#
# All GitHub Actions are pinned to exact commit SHAs for supply-chain security.
# To update a pinned action:
#   1. Find the new release tag at github.com/<owner>/<repo>/releases
#   2. Get the commit SHA: git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
#   3. Update the SHA below and the version comment
#
# Current pins (as of 2026-11-24):
#   actions/checkout          v4.2.2   11bd71901bbe5b1630ceea73d27597364c9af683
#   astral-sh/setup-uv        v5.4.2   d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
#
# WHAT THIS CHECKS, AND WHAT IT CANNOT
#
# It runs the atopile stages that work without authentication: parse, imports,
# field resolution, the type and instance graphs, and ERC. Measured against
# deliberately broken modules, that catches syntax errors, references to
# non-existent fields, and shorted power rails.
#
# It does NOT check `assert` design rules or DRC. Those are not predicates
# evaluated during instantiation — they are constraints handed to a solver, and
# the solve runs AFTER part picking. On atopile 0.15.8+ part picking requires an
# interactive sign-in (`ato auth login`, a browser OAuth flow storing a session
# on disk). There is no token environment variable, no API-key option and no
# OIDC path: `ato auth` offers only `login`, `logout` and `status`. So the
# authenticated tier cannot run in CI at all, by anybody, and it is a
# developer-machine step. See docs/hardware/ATOPILE-TOOLCHAIN.md.
#
# WHY NOT atopile/setup-atopile
#
# The official action does not pip-install atopile; it pulls
# `ghcr.io/atopile/atopile-kicad:<version>`. Checked against the GHCR registry:
# there is NO image for 0.15.8 or 0.15.9 (both 404), while 0.15.7 has one. And
# 0.15.7 is unusable — it resolves parts against `components.atopileapi.com`,
# which no longer exists in DNS. So no single version has both a working parts
# endpoint and a container image, and the action cannot be used with a version
# that works. We install the wheel directly instead.
#
# This workflow previously carried a "KNOWN BROKEN" notice blaming an upstream
# picker bug. That was a misdiagnosis: the picker crash was atopile's error
# handler failing to unwrap an exception, which MASKED the real cause — the DNS
# name it was calling had been retired.

name: Hardware

on:
  push:
    branches: [main]
    paths:
      # The atopile DESIGN, not everything under hardware/. hardware/bom/ holds
      # the sourcing snapshot and candidate exports, which this workflow never
      # reads: it builds the .ato design and runs ERC. Including it meant every
      # sourcing refresh queued a hardware build that could not be affected.
      - 'hardware/elec/**'
      - 'hardware/ato.yaml'
      - 'hardware/ato-lock.yaml'
      - 'xtask/src/hardware.rs'
      - '.github/workflows/hardware.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hardware/elec/**'
      - 'hardware/ato.yaml'
      - 'hardware/ato-lock.yaml'
      - 'xtask/src/hardware.rs'
      - '.github/workflows/hardware.yml'

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-check:
    name: Atopile Design Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install atopile
            # 0.15.9 exactly, and Python 3.14 because 0.15.x declares
            # `requires-python = ">=3.14,<3.15"` — there is no 3.13 fallback.
        run: |
          uv tool install --python 3.14 atopile==0.15.9
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: |
          ato --version
          ato auth status || true

      # Through xtask rather than calling `ato` directly, so the rule deciding
      # what counts as a pass — "every stage green, blocked at part picking on
      # sign-in" — has exactly one implementation, shared with the pre-commit
      # hook. Two copies of that rule would drift, and the drift would be
      # silent in the permissive direction.
      - name: Check every module and the full board
        run: cargo xtask hardware check
