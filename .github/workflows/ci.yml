# CI — SoulAudio DAP (Embedded Rust)
#
# Badge URL (add to README.md):
#   [![CI](https://github.com/yourusername/soulaudio-dap/actions/workflows/ci.yml/badge.svg)](https://github.com/yourusername/soulaudio-dap/actions/workflows/ci.yml)
#
# This repo has THREE Cargo workspaces (the root Cargo.toml `exclude`s dap/ and
# eink-ui/ — see its comment for why they can't share one Cargo.lock). CI mirrors
# the authoritative `cargo xtask verify` gate (xtask/src/gate.rs):
#
#   ROOT            — holds only eink-specs (panel-spec data) + xtask (tooling)
#                     after the v1 Embassy-0.1 firmware stack was retired. It is
#                     fmt-checked ONLY (`fmt`); clippy/test for those two could be
#                     added now that the bit-rotted v1 code is gone.
#   dap/            — the active STM32H7A3 firmware (dap-core logic, dap-sim host
#                     adapters, board-h7a3 bin). Fully gated: fmt-dap, clippy-dap
#                     (host + board-h7a3 thumbv7em), test-dap, build-board-h7a3,
#                     mcu-stack-budget. These check out soul-audio-core as a repo
#                     sibling (.github/actions/checkout-soul-audio-core) at the
#                     PINNED rev in .github/soul-audio-core.pin — reproducible CI,
#                     not a floating @main. Bump deliberately via
#                     tools/soul-audio-core-pin.sh; the soul-audio-core-pin-drift
#                     job warns (non-blocking) when the pin falls behind main.
#   eink-ui/        — the standalone no_std/no-alloc e-ink UI toolkit. Fully gated:
#                     fmt-eink-ui, clippy-eink-ui, build-eink-ui (host + thumbv7em),
#                     test-eink-ui.
#
# Repo-wide: deny (cargo-deny), supply-chain (cargo-audit on the shipped dap/ +
# eink-ui/ lockfiles), unused-deps (machete on the active workspaces),
# arch/arch-boundaries, the lint/guard greps, and forbid-unsafe-coverage.
#
# All GitHub Actions are pinned to exact commit SHAs for supply-chain security.
# To update a pinned action:
#   1. Find the new release tag at github.com/<owner>/<repo>/releases
#   2. Get the commit SHA: git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
#   3. Update the SHA below and the version comment
#
# Current pins (as of 2026-02-20):
#   actions/checkout          v4.2.2   11bd71901bbe5b1630ceea73d27597364c9af683
#   Swatinem/rust-cache       v2.8.2   779680da715d629ac1d338a641029a2f4372abb5
#   dtolnay/rust-toolchain    @1.87    (pinned to a specific stable release for
#                                       reproducible builds; update periodically
#                                       to track new stable releases)
#   dtolnay/rust-toolchain    @1.100.0 (the dynamic QEMU stack job only — its
#                                       output is a GATED MEASUREMENT and the
#                                       stack high-water depends on the compiler,
#                                       so it must not float. Kept in step with
#                                       tools/mcu-stackprobe/rust-toolchain.toml,
#                                       which governs the probe builds.)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Treat all warnings as errors in CI. Individual jobs may override this if
  # a particular check already passes -D warnings via its own flags.
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Format
  # ---------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@1.87
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # cargo-deny — License, advisory, ban, and source checks
  #
  # Runs cargo-deny against the deny.toml at the repo root.
  # Enforces:
  #   advisories — deny known security vulnerabilities (RustSec advisory DB)
  #   bans       — deny minimp3 (unsound), epd-waveshare (wrong controller)
  #   licenses   — allow-list of OSI-approved licenses only
  #   sources    — deny crates from unknown registries or git sources
  #
  # NOTE: --all-features is intentionally NOT used here because `hardware`
  # and `emulator` are mutually exclusive in the firmware crate. Instead we
  # check the default feature set which covers all workspace crates that can
  # compile on the host without cross-compilation.
  # ---------------------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # dap/ path-deps soul-audio-core as a repo sibling. Run cargo-deny NATIVELY
      # (not EmbarkStudios/cargo-deny-action, which runs in a Docker container that
      # mounts only $GITHUB_WORKSPACE — the sibling checkout lives OUTSIDE it, at
      # /github/soul-audio-core, so the action can't read it: "failed to read
      # .../soul-audio-core/.../Cargo.toml"). A native run sees the sibling.
      - uses: ./.github/actions/checkout-soul-audio-core

      # @stable: recent cargo-deny needs rustc >= 1.88.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # Audit the SHIPPED workspaces (dap/ + eink-ui/), not the v1 root — full
      # advisories/bans/licenses/sources. `bans` is back on now that ui-4 made the
      # DAP alloc-free: the deny.toml ban on embedded-alloc no longer conflicts and
      # instead ENFORCES the no-alloc win (plus no minimp3/getrandom/wee_alloc in
      # the firmware). multiple-versions is "warn" (embassy's unavoidable dups).
      - name: cargo-deny (dap/ shipped firmware)
        run: cargo deny --manifest-path dap/Cargo.toml --config deny.toml check advisories bans licenses sources

      - name: cargo-deny (eink-ui/ toolkit)
        run: cargo deny --manifest-path eink-ui/Cargo.toml --config deny.toml check advisories bans licenses sources

  # ---------------------------------------------------------------------------
  # Architecture boundary enforcement via cargo tree
  #
  # Verifies that banned crates (minimp3, epd-waveshare) are not in the root
  # workspace's dependency graph. (The DAP's own graph is covered more
  # thoroughly by the cargo-deny job above; this is a cheap root-level guard.)
  # ---------------------------------------------------------------------------
  arch-boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@1.87

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2

      - name: epd-waveshare must not be in dependency graph
        run: |
          if cargo tree 2>&1 | grep -q "epd-waveshare"; then
            echo "FAIL: epd-waveshare found in dependency graph"
            exit 1
          fi
          echo "OK: epd-waveshare not present in dependency graph"

      - name: minimp3 must not be in dependency graph
        run: |
          if cargo tree 2>&1 | grep -q "minimp3"; then
            echo "FAIL: minimp3 found in dependency graph"
            exit 1
          fi
          echo "OK: minimp3 not present in dependency graph"

      # dap-core INTERNAL module layering (the hexagonal structure in
      # docs/ARCHITECTURE.md): a dependency-free `ports` boundary, feature
      # slices that import only `ports` (screens also `display`), and a free
      # composition layer. Fast static grep over `use crate::…` — no build.
      - name: dap-core module layering must hold
        run: bash tools/check-arch-boundaries.sh

  # ---------------------------------------------------------------------------
  # board-h7a3 cross-build (Embassy 0.6, STM32H7A3)
  #
  # board-h7a3 is a new firmware binary targeting the STM32H7A3 on the
  # Embassy 0.6 line. It is intentionally excluded from the root workspace
  # (see the root Cargo.toml's `workspace.exclude` comment): Embassy 0.1
  # (embassy-executor "=0.6.3", used by the old `firmware` crate above) and
  # Embassy 0.6 (embassy-stm32 "0.6", used here) both pull an
  # `embassy-time-driver` that declares `links = "embassy-time"` — Cargo
  # forbids two packages with the same `links` value in one resolve graph,
  # so the two Embassy major lines cannot share a single Cargo.lock.
  #
  # board-h7a3 therefore lives in the separate `dap/` workspace (dap/board-h7a3,
  # a member of dap/Cargo.toml) — excluded from the Embassy-0.1 root workspace.
  # This job builds it from dap/board-h7a3; `cargo build -p board-h7a3 ...
  # --features hardware` from the repo root fails with "cannot specify features
  # for packages outside of workspace" because dap is excluded above.
  #
  # This job is independent of the Embassy-0.1 `firmware` jobs above — it
  # only proves board-h7a3 itself still cross-compiles for
  # thumbv7em-none-eabihf. `targets: thumbv7em-none-eabihf` on the
  # toolchain action below does the equivalent of `rustup target add`,
  # matching how check-embedded/build-embedded/clippy-embedded above
  # install the target.
  # ---------------------------------------------------------------------------
  build-board-h7a3:
    name: board-h7a3 Cross-Build (STM32H7A3, Embassy 0.6)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dap/board-h7a3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The dap workspace path-deps soul-audio-core as a repo sibling.
      - uses: ./.github/actions/checkout-soul-audio-core

      # Embassy 0.6's dependency stack uses let-chains (stabilized in Rust 1.88),
      # so board-h7a3 needs a newer toolchain than the repo's 1.87 MSRV jobs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: "dap -> target"

      # No flip-link install needed. board-h7a3/.cargo/config.toml OVERRIDES
      # `linker = "rust-lld"` (the root config's flip-link can't find
      # board-h7a3/memory.x when its linker-script scan runs from the workspace
      # root -- see that config's header). Cargo config resolution picks the
      # closest file to the CWD, and this job builds from dap/board-h7a3/, so the
      # board's rust-lld override wins over the root's flip-link -- verified by
      # llvm-nm on the linked ELF (normal layout: _stack_start at the top of
      # RAM). flip-link's stack-overflow protection is provided statically
      # instead: mcu-stack-budget gates the open-path frame sizes, and
      # dap-arch-tests' board_static_footprint_leaves_stack_room_in_linked_axi_sram
      # guards the board's static footprint (App + decoder scratch) plus a stack
      # reserve against the 1 MB AXI SRAM memory.x actually links.
      - name: cargo build board-h7a3 (hardware, ARM target)
        run: cargo build --target thumbv7em-none-eabihf --features hardware

  # ---------------------------------------------------------------------------
  # dap/ workspace format check
  #
  # The dap/ workspace (Embassy 0.6 line) is its own standalone workspace,
  # excluded from the root workspace (see the root Cargo.toml's
  # `workspace.exclude` comment), so it gets its own fmt job rather than being
  # folded into the root `fmt` job above. Cheap and tree-wide, same shape as
  # xtask's `precommit`/`verify` dap fmt-check.
  # ---------------------------------------------------------------------------
  fmt-dap:
    name: dap Workspace Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `cargo fmt --all` loads the workspace manifest, which path-deps
      # soul-audio-core — it must exist on disk even for a format-only job.
      - uses: ./.github/actions/checkout-soul-audio-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all --check (dap)
        run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # dap/ workspace clippy — host + thumbv7em (board-h7a3, hardware feature)
  #
  # Mirrors test-dap / build-board-h7a3 below: stable toolchain (dap's
  # Embassy 0.6 stack uses let-chains, which need Rust 1.88+, newer than the
  # root's 1.87 MSRV jobs), `workspaces: "dap -> target"` cache scoping.
  # Lints the host-only dap-core/dap-sim code (board-h7a3's bin is
  # required-features-gated off on host builds) and separately lints the
  # thumbv7em cross-build of board-h7a3 under its `hardware` feature, which
  # needs flip-link on PATH to resolve the linker.
  # ---------------------------------------------------------------------------
  clippy-dap:
    name: dap Workspace Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The dap workspace path-deps soul-audio-core as a repo sibling.
      - uses: ./.github/actions/checkout-soul-audio-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: "dap -> target"

      - name: Install flip-link (stack overflow protection linker)
        run: cargo install flip-link

      - name: cargo clippy --workspace --all-targets (host)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy -p board-h7a3 (thumbv7em, hardware feature)
        run: cargo clippy -p board-h7a3 --target thumbv7em-none-eabihf --features hardware -- -D warnings

  # ---------------------------------------------------------------------------
  # dap/ workspace host tests (headless logic + audio simulation + arch budgets)
  #
  # The dap/ workspace (dap-core logic + dap-sim host sim adapters + the
  # dap-arch-tests memory-budget guards) runs entirely on the host, no
  # hardware — this gates the headless tests (decode -> resample -> gapless ->
  # volume -> SimSink, etc.) AND the H7A3 SRAM budget guards (dap/arch-tests),
  # since `cargo test` with no `-p`/`--workspace` filter tests every member of
  # dap/Cargo.toml by default — core, sim, arch-tests (board-h7a3's bin is
  # skipped on host: its `hardware` feature is off). It pulls soul-audio-core,
  # so it needs the stable toolchain (let-chains, Rust 1.88+) like the
  # board-h7a3 job above.
  # ---------------------------------------------------------------------------
  test-dap:
    name: dap Workspace Tests (headless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The dap workspace path-deps soul-audio-core as a repo sibling.
      - uses: ./.github/actions/checkout-soul-audio-core

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: "dap -> target"

      - name: cargo test (dap-core + dap-sim + dap-arch-tests, host)
        run: cargo test

  # ---------------------------------------------------------------------------
  # forbid-unsafe-coverage — Rule 2 (no `unsafe`) coverage gate
  #
  # tools/check-forbid-unsafe.sh greps every embedded-path crate's crate-root
  # file (dap-core, dap-sim, board-h7a3, eink-ui, eink-ssd1677, eink-specs) for
  # `#![forbid(unsafe_code)]` and fails, naming the offender, the instant one
  # is missing it (a new crate added without the attribute, or an existing
  # `forbid` weakened during a refactor). There are no longer any allowlisted
  # unsafe exceptions: the v1 host-only eink-emulator (the one that needed Win32
  # unsafe) was retired with the rest of the v1 stack. See docs/plans/2026-11-17-
  # architecture-enforcement-fitness-functions.md, Rule 2 — soul-audio-core
  # itself is gated in its own repo's CI (consumed here only via path dependency).
  #
  # No toolchain/build needed — this is a fast, static grep over known
  # files, so there's no checkout-then-build step beyond actions/checkout.
  # ---------------------------------------------------------------------------
  forbid-unsafe-coverage:
    name: forbid(unsafe_code) coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run the forbid-unsafe coverage gate
        run: bash tools/check-forbid-unsafe.sh

  # ---------------------------------------------------------------------------
  # mcu-stack-budget — static on-target (Cortex-M7) open-path stack gate
  #
  # tools/mcu-stackprobe is a bare-metal thumbv7em-none-eabihf harness that
  # forces soul-audio-core's REAL open_seekable -> Deck::load -> Deck::pump
  # call chain into a linked ELF (the `Deck` lives in a `static`, board-
  # representative — see src/main.rs). tools/mcu-stackprobe/check-stack.sh
  # builds it on nightly with `-Z emit-stack-sizes`, reads the ELF's
  # `.stack_sizes` section via `llvm-readobj --stack-sizes`, and asserts:
  #   - the `__cortex_m_rt_main` entry frame (the open-path stack transient
  #     itself) stays under budget (measured baseline 326,096 B)
  #   - the single largest OTHER function frame on the path stays under
  #     budget (measured baseline 152,024 B —
  #     FlacDecoder<MatroskaFlacReader<..>>::new_in, the Matroska-wrapped-
  #     FLAC edge tracked as Phase A3 in the firmware self-improving-loop
  #     roadmap)
  #
  # A future decoder/format that inflates either number past budget fails
  # CI here, before it ever reaches real hardware. This is purely STATIC
  # (no QEMU — needs admin rights, deferred; see the roadmap's Phase A1/A2).
  #
  # This job ALSO doubles as Rule 1's audio no-alloc gate (MISRA Dir 4.12):
  # mcu-stackprobe deliberately declares no `#[global_allocator]`, so the
  # build step below would fail to LINK ("no global memory allocator
  # found") the instant any crate on soul-audio-core's open/decode path
  # ever pulled in `alloc` — before the stack-size assertions even run. See
  # tools/mcu-stackprobe/README.md for the full writeup and the display-
  # path's separate, still-open alloc gap (dap/sim/tests/alloc_policy.rs).
  #
  # mcu-stackprobe is its own standalone single-crate `[workspace]`, outside
  # the root workspace (own Cargo.lock, nightly-only `-Z` flag), hence the
  # separate toolchain (nightly, not the repo's pinned 1.87) and its own
  # rust-cache workspace scope below.
  # ---------------------------------------------------------------------------
  mcu-stack-budget:
    name: MCU stack budget (Cortex-M7, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # tools/mcu-stackprobe path-deps soul-audio-core as a repo sibling.
      - uses: ./.github/actions/checkout-soul-audio-core

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: "tools/mcu-stackprobe -> target"

      - name: Run the stack-budget gate
        run: bash tools/mcu-stackprobe/check-stack.sh

  # ---------------------------------------------------------------------------
  # mcu-stack-budget-dynamic — DYNAMIC on-target (Cortex-M7) stack gate (QEMU)
  #
  # The dynamic complement to the static `mcu-stack-budget` job above. Where the
  # static gate sums MAIN_FRAME + the single largest OTHER frame from
  # `-Z emit-stack-sizes` (which undercounts a deep construction call chain), this
  # one RUNS the real open->decode->pump workload on `qemu-system-arm -machine
  # mps2-an500` (a Cortex-M7 image) with guest-side stack-painting and measures how
  # far the stack ACTUALLY grew. tools/mcu-stackprobe/check-stack-qemu.sh gates the
  # worst transient across every exercised format against a regression-ratchet
  # budget (DYNAMIC_STACK_BUDGET_KIB, default 256 KiB; current worst is the
  # Matroska-FLAC episode at 219 KiB) AND the board's 592 KiB AXI-SRAM stack
  # headroom. A decoder/format change that balloons the real on-target stack fails
  # here, before hardware. (The static gate was wired long ago; QEMU was deferred
  # for needing a system package — `qemu-system-arm` — which this job apt-installs.)
  #
  # Stable toolchain (the `qemu` feature needs no `-Z`, unlike the static gate's
  # `-Z emit-stack-sizes`), thumbv7em target, soul-audio-core sibling pin. Own
  # rust-cache scope, like the static job (mcu-stackprobe is its own workspace).
  # ---------------------------------------------------------------------------
  mcu-stack-budget-dynamic:
    name: MCU stack budget (Cortex-M7, dynamic/QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # tools/mcu-stackprobe path-deps soul-audio-core as a repo sibling.
      - uses: ./.github/actions/checkout-soul-audio-core

      # Pinned, NOT @stable: this job's output is a gated measurement, and the
      # measured stack high-water depends on the compiler (1.95.0 -> 393 KiB vs
      # 1.100.0 -> 308 KiB on identical source). tools/mcu-stackprobe carries a
      # rust-toolchain.toml with the same version, which is what actually governs
      # the probe builds; this keeps the action from downloading a second
      # toolchain. Bump both together, and re-measure the budgets when you do.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: "tools/mcu-stackprobe -> target"

      - name: Install QEMU (qemu-system-arm)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Run the dynamic stack-budget gate (QEMU mps2-an500)
        run: bash tools/mcu-stackprobe/check-stack-qemu.sh

      # Whole-firmware-tick gate: the board-accurate number. check-stack-qemu.sh
      # above measures the decode path in isolation (~297 KiB); this runs the real
      # `dap_core::firmware::step` (App::tick open→decode THEN App::render) and
      # gates its worst transient (~413 KiB — the wrapper + render frames the
      # isolated probe never counts). Same QEMU install + soul-audio-core pin.
      - name: Run the whole-firmware-tick stack gate (QEMU mps2-an500)
        run: bash tools/mcu-stackprobe/check-tick-qemu.sh

  # ---------------------------------------------------------------------------
  # Unused dependencies — cargo machete
  #
  # cargo machete detects dependencies declared in Cargo.toml that are not
  # actually used in any source file. Unused deps waste compile time and bloat
  # the dependency graph.
  #
  # Some embedded-only deps (defmt, cortex-m-rt, panic-probe) appear unused
  # to machete because they are used via link-time magic or cfg(target_arch).
  # These are suppressed via .cargo-machete.toml at the repo root.
  # ---------------------------------------------------------------------------
  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # @stable, not @1.87: cargo-machete's recent releases need rustc >= 1.88.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      # Scope to the ACTIVE workspaces — the dap/ shipped firmware and the
      # eink-ui/ toolkit. The root workspace is the bit-rotted v1 salvage
      # (gate.rs: root is fmt-only), so it is deliberately not machete-checked.
      - name: Check for unused dependencies (dap/)
        run: cargo machete dap

      - name: Check for unused dependencies (eink-ui/)
        run: cargo machete eink-ui

  # ---------------------------------------------------------------------------
  # Lint coverage — every crate must opt into workspace lints
  #
  # Without [lints]\nworkspace = true, the safety lints defined in
  # [workspace.lints] (arithmetic_side_effects, indexing_slicing,
  # unsafe_op_in_unsafe_fn) are silently inactive in that crate. This job
  # catches any new crate that forgets to add the opt-in.
  # ---------------------------------------------------------------------------
  lint-coverage:
    name: All crates opt into workspace lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify workspace lint opt-in
        run: |
          # Every crate Cargo.toml must have [lints] workspace = true.
          # grep -L prints files that do NOT match.
          # `|| true`: the step shell is `bash -e`, and when nothing is missing
          # the trailing `grep -v` gets empty input and exits 1 — which under
          # `set -e` would fail the step on the HEALTHY (nothing-missing) path.
          MISSING=$(grep -rL "workspace = true" \
            crates/*/Cargo.toml \
            crates/*/*/Cargo.toml \
            xtask/Cargo.toml \
            2>/dev/null | grep -v "target/" || true)
          if [ -n "$MISSING" ]; then
            echo "ERROR: The following Cargo.toml files are missing [lints] workspace = true:"
            echo "$MISSING"
            echo ""
            echo "Add the following to each missing Cargo.toml:"
            echo ""
            echo "  [lints]"
            echo "  workspace = true"
            exit 1
          fi
          echo "OK: All crates opt into workspace lints"

  # ---------------------------------------------------------------------------
  # Supply chain security (GAP-L3)
  #
  # `cargo audit` checks Cargo.lock against the RustSec advisory database and
  # fails the build if any dependency has a known CVE or security advisory.
  #
  # Without this step, CVEs disclosed after a field deployment require manual
  # cross-referencing of the advisory database against the dependency graph —
  # which is error-prone and slow. CI automation catches vulnerabilities on
  # every PR before they reach a build artifact.
  #
  # Note on cargo-auditable:
  #   `cargo-auditable` embeds a compressed dependency manifest into ELF
  #   binaries, enabling `cargo audit bin <elf>` on field-deployed firmware.
  #   The embedded manifest covers the exact dependency tree frozen at build
  #   time — critical for post-deployment CVE disclosure on deployed units.
  #   Install via: cargo install cargo-auditable
  #   Use via:     cargo auditable build --release ...
  #   Audit ELF:   cargo audit bin target/.../firmware
  #
  # cargo audit (below) checks Cargo.lock for pre-deployment CVE scanning.
  # cargo-auditable ELF embedding is now done in the build-embedded job above.
  # Use: cargo audit bin target/thumbv7em-none-eabihf/release/firmware
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # @stable, not @1.87: cargo-audit's recent releases need rustc >= 1.88.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Audit the SHIPPED lockfiles for RustSec advisories: the dap/ firmware
      # workspace and the eink-ui/ toolkit (the audio deps are additionally
      # audited in soul-audio-core's own security CI). The root workspace is the
      # bit-rotted, unshipped v1 salvage (gate.rs: fmt-only) and is not audited.
      # RUSTSEC-2024-0436 (paste, unmaintained, transitive) is ignored to match
      # deny.toml. NOTE: cargo-vet (manual trust annotations) was configured for
      # the root workspace only; porting the vet corpus to dap/ + eink-ui/ is
      # tracked as follow-up (task 11) — cargo-audit covers advisories meanwhile.
      - name: cargo audit (dap/ shipped firmware)
        run: cargo audit --file dap/Cargo.lock --ignore RUSTSEC-2024-0436

      - name: cargo audit (eink-ui/ toolkit)
        run: cargo audit --file eink-ui/Cargo.lock --ignore RUSTSEC-2024-0436

  # ---------------------------------------------------------------------------
  # no-todo-in-production: Enforced at compile time by workspace lint
  # clippy::todo = "deny" and clippy::unimplemented = "deny".
  # Shell grep is redundant and fragile (bypassed by string concat).
  # The clippy job above (cargo clippy -- -D warnings) is the authoritative check.
  #
  # This job retains only the lint-presence verification: it checks that
  # Cargo.toml actually declares the deny lints, so the clippy job is effective.
  # ---------------------------------------------------------------------------
  no-todo-in-production:
    name: Verify todo/unimplemented workspace lints are configured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify todo-deny workspace lint is configured
        run: |
          grep -q 'todo.*=.*"deny"' Cargo.toml || { echo "ERROR: clippy::todo must be deny in workspace lints"; exit 1; }
          echo "OK: clippy::todo = deny is configured"

      - name: Verify unimplemented-deny workspace lint is configured
        run: |
          grep -q 'unimplemented.*=.*"deny"' Cargo.toml || { echo "ERROR: clippy::unimplemented must be deny in workspace lints"; exit 1; }
          echo "OK: clippy::unimplemented = deny is configured"

  cargo-lock-committed:
    name: Verify Cargo.lock is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify Cargo.lock exists (not gitignored)
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "ERROR: Cargo.lock is not committed to the repository."
            echo "Firmware builds must be reproducible. Commit Cargo.lock and"
            echo "remove it from .gitignore."
            exit 1
          fi
          echo "OK: Cargo.lock is committed"

      - name: Verify .gitignore does not exclude Cargo.lock
        run: |
          if grep -qx "Cargo.lock" .gitignore 2>/dev/null; then
            echo "ERROR: .gitignore excludes Cargo.lock."
            echo "Remove 'Cargo.lock' from .gitignore for reproducible builds."
            exit 1
          fi
          echo "OK: .gitignore does not exclude Cargo.lock"

  # ---------------------------------------------------------------------------
  # eink-ui/ workspace — the standalone, publishable no_std/no-alloc e-ink UI
  # toolkit (docs/plans/2026-11-16-eink-ui-toolkit-design.md). It is its own
  # workspace (the root Cargo.toml `exclude`s it), so it gets its own jobs that
  # mirror `cargo xtask verify`'s eink-ui gating (xtask/src/gate.rs): fmt, clippy
  # (--all-features), the no_std host build, the thumbv7em cross-build, and the
  # std-gated golden-test harness. No soul-audio-core sibling is needed — eink-ui
  # has no audio dependencies.
  # ---------------------------------------------------------------------------
  fmt-eink-ui:
    name: eink-ui Workspace Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eink-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all --check (eink-ui)
        run: cargo fmt --all --check

  clippy-eink-ui:
    name: eink-ui Workspace Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eink-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: "eink-ui -> target"

      - name: cargo clippy --all-targets --all-features (eink-ui)
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-eink-ui:
    name: eink-ui Build (no_std host + thumbv7em cross)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eink-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: "eink-ui -> target"

      - name: cargo build (default no_std/no-alloc, host)
        run: cargo build

      - name: cargo build --target thumbv7em-none-eabihf (cross)
        run: cargo build --target thumbv7em-none-eabihf

  test-eink-ui:
    name: eink-ui Workspace Tests (golden, std)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eink-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5  # v2.8.2
        with:
          workspaces: "eink-ui -> target"

      - name: cargo test --features std (golden-test harness)
        run: cargo test --features std

  # ---------------------------------------------------------------------------
  # eink-ui dependency boundary
  #
  # eink-ui is a standalone, extractable toolkit (`git mv eink-ui <new-repo>` +
  # publish). It may depend ONLY on embedded-graphics + heapless (+ image behind
  # the `std` test feature). Any dap-/soul-/product dependency would couple it to
  # this repo and break the extraction path — fail CI if one ever appears.
  # (The eink-ui CI jobs already build it with no soul-audio-core sibling, so a
  # product dep would also fail those; this is the explicit, fast declaration.)
  # ---------------------------------------------------------------------------
  eink-ui-boundary:
    name: eink-ui dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: eink-ui must not depend on any product crate
        run: |
          FORBIDDEN=$(grep -nE '^(dap-|soul-|eink-system|eink-components|eink-specs|eink-emulator|eink-testing|platform|firmware|bluetooth)[[:alnum:]_-]*[[:space:]]*=' eink-ui/Cargo.toml || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: eink-ui gained a product dependency — it must stay a standalone,"
            echo "extractable toolkit (embedded-graphics + heapless + image only):"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "OK: eink-ui depends only on its standalone toolkit deps"

  # ---------------------------------------------------------------------------
  # soul-audio-core pin drift (informational, never fails)
  #
  # The dap jobs build against the soul-audio-core commit pinned in
  # .github/soul-audio-core.pin (reproducible CI; see that file + the
  # checkout-soul-audio-core composite action). This job surfaces the OTHER
  # failure mode of a pin — going silently stale — by warning when the pin is
  # behind soul-audio-core main, without blocking the PR. Bumping is deliberate:
  # tools/soul-audio-core-pin.sh --latest, then re-verify the dap build.
  # ---------------------------------------------------------------------------
  soul-audio-core-pin-drift:
    name: soul-audio-core pin drift (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Report pin vs soul-audio-core main
        run: |
          PIN=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' .github/soul-audio-core.pin | head -1 | tr -d '[:space:]')
          MAIN=$(git ls-remote https://github.com/soulaudio/soul-audio-core refs/heads/main | cut -f1)
          {
            echo "### soul-audio-core pin"
            echo "- pinned (CI builds against): \`$PIN\`"
            echo "- soul-audio-core main tip:   \`$MAIN\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PIN" = "$MAIN" ]; then
            echo "- status: up to date ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "soul-audio-core pin is up to date with main."
          else
            echo "- status: **behind main** — compare https://github.com/soulaudio/soul-audio-core/compare/$PIN...$MAIN" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=soul-audio-core pin is behind main::Pinned $PIN; main is $MAIN. Bump deliberately via tools/soul-audio-core-pin.sh --latest after re-verifying the dap build. Informational only — does not fail CI."
          fi
