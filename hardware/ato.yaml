# SoulAudio DAP — Atopile Project Manifest
# https://docs.atopile.io/atopile/reference/config
#
# Toolchain pin. See docs/hardware/ATOPILE-TOOLCHAIN.md for the measurements
# behind this number — it is not a preference, it is the only version that works.
#
# The previous pin was "^0.12.5", chosen to stay on a stable line. That line is
# now permanently dead: 0.12.x and 0.15.7 resolve parts against
# `components.atopileapi.com`, which NO LONGER RESOLVES IN DNS. Only 0.15.8+
# points at `legacy.atopileapi.com`, which is alive. So the choice is 0.15.8+ or
# nothing, regardless of how stable the older line looks.
requires-atopile: "^0.15.9"

paths:
  src: elec/src
  layout: elec/layouts

builds:
  # ── default ──────────────────────────────────────────────────────────────
  # Full build: BOM + manufacturing data + PCB layout update.
  # Run locally with KiCad installed: `ato build`
  default:
    entry: elec/src/main.ato:SoulAudioDAP
    targets:
      - default
    # ── Locking ──────────────────────────────────────────────────────────────
    #
    # atopile MODIFIES the .kicad_pcb in place on every build — there is no
    # netlist hand-off, the PCB is the output. So every placement, designator and
    # net name is something a rebuild can change, and these three keys are what
    # stop it doing so silently.
    #
    # keep_designators defaults to true already; it is stated explicitly because
    # relying on an upstream default for something this consequential is how it
    # changes under you in a minor release.
    #
    # keep_picked_parts matters most: without it a rebuild re-queries the parts
    # service and can swap a 100 nF 0402 for a different maker's 100 nF 0402,
    # which is invisible in a diff of the .ato sources and visible in a reel you
    # have already bought.
    keep_designators: true
    keep_net_names: true
    keep_picked_parts: true
    exclude_checks:
      # PCB layout is in progress — DRC will fail until routing is complete.
      # Remove this exclusion once the board is fully routed.
      - PCB.requires_drc_check



  # `check-only` and `bom-only` used to live here, both entered at
  # `main.ato:SoulAudioDAP` like `default`. atopile 0.15.x rejects that outright:
  #
  #   Multiple build targets share the same entry point in ato.yaml
  #     Conflicting build targets: `bom-only`, `check-only`, `default`
  #
  # The distinction they encoded is an invocation concern, not a build, so it
  # moved to the command line: `ato build -b default -t bom` for a BOM,
  # `-t default` for the full artefact set. Neither needs KiCad.

  # ── per-module check targets ───────────────────────────────────────────────
  # Each module can be validated independently. This enables:
  #   1. Faster CI feedback (module that changed is re-checked immediately)
  #   2. Isolation: a broken module doesn't mask failures in others
  #   3. Component-level asserts (resistance, capacitance, frequency) validated
  #      without requiring the full top-level wiring
  #
  # Voltage-level asserts on port signals (e.g. power_3v3.voltage) are
  # additionally verified by the full check-only target which propagates
  # voltages across module boundaries via main.ato.
  #
  # targets: [bom] — see check-only comment above for why this is required.
  # DO NOT use targets: [] — triggers KiCad full-build mode initialization
  # which fails on CI without KiCad installed.
  #
  # Run a single module: ato build --build check-power
  check-power:
    entry: elec/src/power.ato:Power
    targets:
      - bom
    exclude_checks:
      - PCB.requires_drc_check

  check-mcu:
    entry: elec/src/mcu.ato:MCU
    targets:
      - bom
    exclude_checks:
      - PCB.requires_drc_check

  check-audio:
    entry: elec/src/audio.ato:Audio
    targets:
      - bom
    exclude_checks:
      - PCB.requires_drc_check

  check-display:
    entry: elec/src/display.ato:Display
    targets:
      - bom
    exclude_checks:
      - PCB.requires_drc_check

  check-bluetooth:
    entry: elec/src/bluetooth.ato:Bluetooth
    targets:
      - bom
    exclude_checks:
      - PCB.requires_drc_check

  check-memory:
    entry: elec/src/memory.ato:Memory
    targets:
      - bom
    exclude_checks:
      - PCB.requires_drc_check

  check-input:
    entry: elec/src/input.ato:Input
    targets:
      - bom
    exclude_checks:
      - PCB.requires_drc_check

  check-clock:
    entry: elec/src/clock.ato:HseClock
    targets:
      - bom
    exclude_checks:
      - PCB.requires_drc_check
