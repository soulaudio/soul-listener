[package]
name = "mcu-stackprobe"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

# A standalone workspace of one — like dap/Cargo.toml and eink-ui/Cargo.toml —
# so this crate has its OWN Cargo.lock and never becomes a member of the
# soul-listener-gh root workspace. (It still inherits the root's
# .cargo/config.toml via directory-walk discovery, which is a separate
# mechanism from workspace membership — see .cargo/config.toml's comment for
# why `linker` is explicitly overridden there.)
[workspace]

[[bin]]
name = "mcu-stackprobe"
test = false
bench = false

# The whole-firmware-tick probe (feature `tick`): drives dap-core's real
# `firmware::step` — App::tick (open→decode) THEN App::render (e-ink flex
# layout + widget draw) — on QEMU with the same stack-painting, so the gated
# number is the WHOLE tick's worst transient, not just the decode path main.rs
# measures. `required-features` keeps it out of the default/static build (and
# the `-Z emit-stack-sizes` gate), so adding it can't perturb those.
[[bin]]
name = "mcu-tickprobe"
path = "src/bin/tickprobe.rs"
required-features = ["tick"]
test = false
bench = false

[dependencies]
# Sibling repo D:/dev/soulaudio/soul-audio-core, three levels up from this
# file (tools/mcu-stackprobe/Cargo.toml -> tools/ -> soul-listener-gh/ ->
# soulaudio/). embedded-profile: the stereo DAP target profile (drops the
# surround-Opus AnyDecoder variant) — see dap/Cargo.toml's workspace.dependencies
# comment for the full rationale; mirrored here since this harness measures
# the same decode path the DAP board will run.
soul-audio-core = { path = "../../../soul-audio-core/crates/soul-audio-core", default-features = false, features = ["embedded-profile"] }
# dap-core (the board-agnostic App + firmware::step + stub ports) — only the
# `tick` feature's whole-firmware-tick measurement uses it (see main.rs). It is
# a MEMBER of the dap/ workspace, so its own deps (soul-audio-core/-engine,
# eink-ui/-specs, embedded-graphics, heapless) resolve via dap/Cargo.toml's
# [workspace.dependencies]; critically, that soul-audio-core path + features
# (embedded-profile) canonicalize to the exact same package this crate already
# path-deps above, so cargo unifies them into one instance (no duplicate, no
# embassy — dap-core is runtime-agnostic). `stub` pulls in the no-op port
# adapters the tick harness wires the App with.
dap-core = { path = "../../dap/core", default-features = false, features = ["stub"], optional = true }
cortex-m-rt = "0.7"
cortex-m = "0.7"
panic-halt = "0.2"
static_cell = "2"
# Only used by the `qemu` feature: semihosting stdout + SYS_EXIT so a QEMU run
# can print the measured stack high-water and terminate the emulator cleanly.
cortex-m-semihosting = { version = "0.5", optional = true }

[features]
# Build the DYNAMIC measurement variant: paint the stack, run the real decode
# workload under QEMU mps2-an500, scan for the high-water, print it + exit.
# Without this feature the crate is the original STATIC `-Z emit-stack-sizes`
# target (check-stack.sh) and is never actually executed.
qemu = ["dep:cortex-m-semihosting"]
# Build the whole-firmware-tick probe (the `mcu-tickprobe` bin): pulls in
# dap-core (App/firmware/stub) and semihosting. Run with
# `cargo run --bin mcu-tickprobe --features tick` (check-tick-qemu.sh does this).
tick = ["dep:dap-core", "dep:cortex-m-semihosting"]

[profile.release]
# Cargo's release defaults already give opt-level = 3; spelled out here so
# this is unambiguously the "release / opt-3" build the measurement is about.
opt-level = 3
# No unwind runtime on this bare-metal target; panic-halt is the handler.
panic = "abort"
# Keep symbol names (and thus -Z emit-stack-sizes' per-function table)
# readable in the final ELF.
debug = true
strip = false
# NOTE on LTO: dap/board-h7a3 (the real firmware this harness stands in for)
# is its OWN standalone workspace with no [profile.release] override, so it
# gets cargo's plain release defaults — opt-level 3, lto = false,
# codegen-units = 16 — which is what this profile intentionally mirrors
# (NOT the repo ROOT's unrelated [profile.release], which is a different
# workspace's old-firmware profile using fat LTO + codegen-units = 1).
# Measured empirically: turning fat LTO + codegen-units=1 ON here does NOT
# shrink the worst frames — it grows several of them sharply (e.g.
# `dispatch::open`'s own frame goes from invisible/tiny to ~259 KB), because
# aggressive cross-function inlining merges many mutually-exclusive decoder
# constructors into one function faster than LLVM's stack-slot coloring can
# prove their lifetimes don't overlap. The no-LTO default is both the
# faithful match for the real firmware AND the more conservative (larger)
# per-callee numbers are avoided — see the measurement notes for the
# sensitivity comparison.

[profile.dev]
panic = "abort"

# Mirrors dap/Cargo.toml's `[profile.dev.package.soul-audio-core]` /
# `[profile.test.package.soul-audio-core]` overrides: keep soul-audio-core at
# -O3 regardless of this crate's own profile, so the measured decode path is
# always the realistic release build the board will actually run.
[profile.dev.package.soul-audio-core]
opt-level = 3
[profile.release.package.soul-audio-core]
opt-level = 3
