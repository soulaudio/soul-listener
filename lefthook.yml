# lefthook.yml — git hooks for soul-listener.
#
# Requires the lefthook binary. Install one of:
#   go install github.com/evilmartians/lefthook@latest
#   npm i -D lefthook   |   scoop install lefthook   |   choco install lefthook
#
# Enable the hooks once per clone:  lefthook install
# (If you use a global `core.hooksPath` dispatcher that delegates to lefthook,
#  don't run `lefthook install` — it would target the global dir.)

# Fast checks — keep commits quick. `xtask precommit` fmt-checks BOTH
# workspaces (root `crates/*` + `dap/`) and clippies only the active `dap/`
# workspace: the root's v1 Embassy-0.1 salvage code is bit-rotted (red
# clippy/tests, tracked separately), so it is never clippy/test-gated here.
pre-commit:
  commands:
    checks:
      glob: "*.{rs,toml}"
      run: cargo xtask precommit

# Commit-message policy: Conventional Commits + a clean history (no AI /
# attribution trailers). Pure-Rust check so it behaves identically on every
# platform — `{1}` is the path to the commit-message file git passes in.
commit-msg:
  commands:
    policy:
      run: cargo xtask check-commit-msg {1}

# Full gate before pushing: everything `precommit` does, plus the dap/
# board-h7a3 thumbv7em cross-checks (clippy + build) and `cargo test` for the
# dap/ workspace. This mirrors the authoritative CI gate (the
# fmt-dap/clippy-dap/test-dap/build-board-h7a3 jobs in
# .github/workflows/ci.yml).
pre-push:
  commands:
    gate:
      run: cargo xtask verify
