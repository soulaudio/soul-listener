# lefthook.yml — git hooks for soul-listener.
#
# Requires the lefthook binary. Install one of:
#   go install github.com/evilmartians/lefthook@latest
#   npm i -D lefthook   |   scoop install lefthook   |   choco install lefthook
#
# Enable the hooks once per clone:  lefthook install
# (If you use a global `core.hooksPath` dispatcher that delegates to lefthook,
#  don't run `lefthook install` — it would target the global dir.)

# Fast checks — keep commits quick. `xtask precommit` fmt-checks all three
# workspaces (root, `dap/`, `eink-ui/`) and clippies the active `dap/` and
# `eink-ui/` ones. The root now holds only `eink-specs` + `xtask` (the v1
# Embassy-0.1 firmware stack was retired); it stays fmt-only here.
pre-commit:
  commands:
    checks:
      glob: "*.{rs,toml}"
      run: cargo xtask precommit

    # Atopile, per VERTICAL SLICE. Editing `power.ato` checks `check-power` and
    # nothing else: 20-35 s measured, against about 5 minutes for every module
    # plus the whole board. That is the difference between a hook people keep and
    # a hook people bypass with `--no-verify`.
    #
    # A change to anything shared (`main.ato`, `interfaces.ato`, `parts/**`,
    # `ato.yaml`) cannot be attributed to one slice and escalates to the full
    # check. Conservative on purpose: the cost of guessing wrong that way is a
    # slow commit; the other way it is an unchecked design.
    #
    # WHAT THIS CATCHES: syntax, imports, field resolution, the instance graph
    # and ERC. WHAT IT DOES NOT: `assert` design rules and DRC. Those need the
    # constraint solver, which runs after part picking, which on atopile 0.15.8+
    # requires sign-in — so they are checked by the Hardware workflow with a
    # token, not here. See docs/hardware/ATOPILE-TOOLCHAIN.md.
    #
    # Skips with a notice when `ato` is not installed, since most contributors
    # here touch firmware and have no reason to carry a Python 3.14 toolchain.
    # Also covers the generated pin map: editing a .ato changes the component
    # pin assignments, and `hardware check` fails until the map is regenerated.
    hardware:
      glob: "hardware/**/*.{ato,yaml}"
      run: cargo xtask hardware check-changed {staged_files}

# Commit-message policy: Conventional Commits + a clean history (no AI /
# attribution trailers). Pure-Rust check so it behaves identically on every
# platform — `{1}` is the path to the commit-message file git passes in.
commit-msg:
  commands:
    policy:
      run: cargo xtask check-commit-msg {1}

# Full gate before pushing: everything `precommit` does, plus the dap/
# board-h7a3 thumbv7em cross-checks (clippy + build) and `cargo test` for the
# dap/ workspace. This mirrors the authoritative CI gate (the
# fmt-dap/clippy-dap/test-dap/build-board-h7a3 jobs in
# .github/workflows/ci.yml).
pre-push:
  commands:
    gate:
      run: cargo xtask verify
