[target.thumbv7em-none-eabihf]
# flip-link flips the memory layout so the stack is placed BELOW .bss+.data.
# A stack overflow therefore hits the bottom of RAM (HardFault) instead of
# silently corrupting DMA buffers in AXI SRAM.
# Install: cargo install flip-link
linker = "flip-link"
runner = "probe-rs run --chip STM32H743ZITx"
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

# [build]
# Note: Commented out to allow emulator builds
# Specify --target thumbv7em-none-eabihf explicitly for hardware builds
# target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"

[alias]
# Generic xtask entry point (lefthook.yml's pre-commit/commit-msg/pre-push
# hooks call `cargo xtask precommit|verify|check-commit-msg`).
xtask = "run -p xtask --"

# Hardware design (Atopile) — cargo hw <check|build|sync|bom>
hw = "run -p xtask -- hardware"

# Quick commands
rb = "build --release"
rr = "run --release"

# Testing
test-unit = "test --lib"
test-all = "test --workspace --all-features"

# Analysis
expand = "expand --lib"
# NOTE: the old firmware-bin aliases (flash/dev/size/bloat, which targeted the
# retired v1 `--bin firmware`) were removed with the v1 stack. The active board
# binary lives in the `dap/` workspace — flash/size it from there (e.g.
# `cd dap && cargo build -p board-h7a3 --target thumbv7em-none-eabihf --features hardware`).
